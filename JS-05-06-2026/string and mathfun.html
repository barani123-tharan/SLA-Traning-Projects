<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String And Math Functions In JS</title>
    

    <script>
       
       console.log("Hello World")
       
        console.log("internal script")

          // Math Functions

        console.log("math function=>math");

        console.log(Math.PI.toFixed(2));

        console.log(Math.abs(-5));// negivate to postive

        console.log(Math.round(4.5));// round =>4.1 to 4 =>4, 4.5 to9 =>5

        console.log(Math.floor(4.9))// floor => it remove point

        console.log(Math.ceil(4.1)) // 4.1 =>5

        console.log(Math.pow(10,2));//2*2*2*2*2 power

        console.log(Math.round(Math.random()*5+1)) //  random

        console.log(Math.log(10));

        console.log(Math.sqrt(4));

        console.log(Math.min(20,30,20,90,10));

        console.log(Math.max(78,90,76,12));

        console.log(Math.SQRT2);

        console.log(Math.exp(2));

        console.log(Math.E);//he mathematical constant e. This is Euler's number, the base of natural logarithms.

        console.log(Math.sign(78)); // 1 postive or negivate -1

        // String Functions

               let s1="Hello";

        let s2="     word 100 ";

        console.log(s1.length);

        console.log(s1.concat("+",s2));

        console.log(s2.replace("word","guys")) //pre, new

        console.log(s2.repeat(4)); // repalce

        console.log(s2.trim()) // remove start and end space

        console.log(s1.charAt(4));

        console.log(s1.split("")); //separate

        console.log(s1.toUpperCase());

        console.log(s1.toLowerCase());

        console.log(s1.toLocaleUpperCase());//

        console.log(s1.includes("Hello")); //true or false

        console.log(s1.startsWith("H"));

        console.log(s1.endsWith("o"));

        console.log(s1.slice(0,5)); // index 1



 console.log(s1.substring(3,5)) // not reverse  start end index

        console.log("String substr:",s1.substr(5,20));

        console.log(s1.padStart(10,"*")); //5+5=10

        console.log(s1.padStart(10,"o"));

        console.log(s1.padEnd(10,"$"));

        console.log(s1.charCodeAt("4"));// memory address

       console.log("String substr:",s1.substr(0,4)); //start, count


    </script>


</head>

</body>
</html>
