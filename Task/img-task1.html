<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Img Task 1</title>
    <style>

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #26a3ff;
            font-family: Arial, sans-serif;
        }

        .card-container {
            background-color: #ffffff;
            width: 1100px;  
            height: 650px;
            border-radius: 0px;
            box-shadow: 0 20px 40px black;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .card-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 100%;
            background-color: #f1edf7;
            border-radius: 0 0 400px 0;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 20px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }
        .thin { font-weight: 400; color: #555; } 
        .bold { font-weight: 900; color: #000; }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }
        .search-icon {
            background-color: #000;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        .main-content {
            display: flex;
            flex: 1;
            padding: 0 60px 40px 60px;
            position: relative;
            z-index: 10;
        }

        .content-left {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .content-left b {
            font-size: 90px;
            font-family: 'Franklin Gothic Medium', Arial, sans-serif;
            line-height: 1;
            margin: 0 0 10px 0;
        }

        .content-left h3 {
            font-size: 18px;
            color: #444;
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .content-left p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 30px 0;
            max-width: 340px;
        }

        .content-left button {
            align-self: flex-start;
            color: black;
            border-radius: 25px;
            padding: 12px 35px;
            cursor: pointer;
            border: 1.5px solid black;
            background-color: transparent;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .content-left button:hover {
            background-color: #000;
            color: #fff;
        }

        .footer-social {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: auto;
        }
        .social-icons {
            display: flex;
            gap: 8px;
        }
        .social-icons img {
            height: 28px;
            width: 28px;
            cursor: pointer;
        }
        .hashtag {
            font-size: 13px;
            color: #555;
            font-weight: 600;
        }

        .content-right {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .illustration {
            max-width: 100%;
            max-height: 90%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <header>
            <div class="logo">
                <span class="thin">YOUR</span><span class="bold">LOGO</span>
            </div>
            <nav>
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Services</a>
                <div class="search-icon"></div>
            </nav>
        </header>

        <main class="main-content">
            <section class="content-left">
                <b>CMS</b>
                <h3>Content Management System</h3>
                <p>Lorem ipsum dolor sit amet consectetuer adipiscing elit sed diam nonummy nih et.</p>
                
                <button>Try Now</button>

                <div class="footer-social">
                    <div class="social-icons">
                        <img src="facebook.png" alt="Facebook">
                        <img src="instagram.png" alt="Instagram">
                        <img src="twitter.png" alt="Twitter">
                    </div>
                    <span class="hashtag">#cmsystem</span>
                </div>
            </section>

    
            <section class="content-right">
                <img class="illustration" src="background.png" alt="CMS Illustration Graphic">
            </section>
        </main>
    </div>

</body>
</html>
