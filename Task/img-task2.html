<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get In Touch Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#6c63ff;
    padding:20px;
}

.container{
    width:1000px;
    max-width:100%;
    display:flex;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.left{
    flex:1;
    background:#f5efe8;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
}

.left img{
    width:100%;
    max-width:420px;
}

.left h1{
    align-self:flex-start;
    color:#2d236f;
    font-size:42px;
    font-weight:bold;
    text-transform:uppercase;
}

.arrow{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#f8c95b;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    color:white;
    cursor:pointer;
}

.right{
    flex:1;
    background:#2d236f;
    padding:40px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

label{
    color:white;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
}

input,
textarea{
    width:100%;
    padding:10px;
    border:none;
    border-radius:5px;
    background:#e9dcf2;
    outline:none;
}

textarea{
    resize:none;
    height:120px;
}

button{
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:6px;
    background:#6c63ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#857dff;
}

@media(max-width:768px){
    .container{
        flex-direction:column;
    }

    .left h1{
        font-size:30px;
        margin-top:20px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="left">

        <img src="background.png" alt="Contact">

        <h1>Get In Touch</h1>

        <div class="arrow">➜</div>

    </div>

    <div class="right">

        <form>

            <label>Name</label>
            <input type="text" placeholder="Full Name">

            <label>Company</label>
            <input type="text" placeholder="Company Name">

            <label>Phone</label>
            <input type="tel" placeholder="Phone Number">

            <label>Email Address</label>
            <input type="email" placeholder="Your Best Email Address">

            <label>Message Subject</label>
            <input type="text" placeholder="Briefly Describe The Subject">

            <label>Message</label>
            <textarea placeholder="Write your message here..."></textarea>

            <button type="submit">SEND MESSAGE</button>

        </form>

    </div>

</div>

</body>
</html>
