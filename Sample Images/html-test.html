<!DOCTYPE html>

<head>

    <title>About College</title>
    <style>
        body {

            margin: 0;
            padding: 20px;

            color: darkblue;
        }

        .container {
            display: flex;
            flex-direction: column;

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px gray;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: gray;
        }

        iframe, object, embed {
            width: 100%;
            height: 250px;
            border: 1px solid lightgray;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Campus Resource Media Hub</h1>

        <!-- Embed Element -->
