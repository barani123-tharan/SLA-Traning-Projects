<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
    <link rel="icon" href="Sample Images/studentlogo.jpg">
</head>
<body style="background-color: gainsboro; font-family: Arial, sans-serif;">

<h1>Student Information Form</h1>

<form>
    <label for="student-name">Name:</label>
    <input type="text" id="student-name" name="student_name" placeholder="Enter Your Name"><br><br>

    <label for="student-email">Email:</label>
    <input type="email" id="student-email" name="student_email" placeholder="Enter Your Email"><br><br>

    <label for="student-phone">Phone:</label>
    <input type="tel" id="student-phone" name="student_phone" placeholder="Enter Your Phone Number"><br><br>

    <label for="student-dob">Date of Birth:</label>
    <input type="date" id="student-dob" name="student_dob"><br><br>

    <label for="dob-student">Date of Joining:</label>

    <label for="student-age">Age:</label>
    <input type="number" id="student-age" name="student_age" placeholder="Enter Your Age"><br><br>

    <label for="student-gender">Gender:</label>
    <select id="student-gender" name="student_gender">
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select><br><br>

    <label for="student-blood-group">Blood Group:</label>
    <select id="student-blood-group" name="student_blood_group">
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
    </select><br><br>

    <label for="student-address">Address:</label>
    <textarea id="student-address" name="student_address" placeholder="Enter Your Address"></textarea><br><br>

    <label for="student-password">Password:</label>
    <input type="password" id="student-password" name="student_password" placeholder="Enter Your Password"><br><br>
    
    <label for="student-confirm-password">Confirm Password:</label>
    <input type="password" id="student-confirm-password" name="student_confirm_password" placeholder="Confirm Your Password"><br><br>

    <label for="student-country">Country:</label>
    <select id="student-country" name="student_country">
        <option value="">Select Country</option>
        <option value="IN">INDIA</option>
        <option value="US">USA</option>
        <option value="UK">UK</option>
    </select><br><br>

    <label for="student-course">Course:</label>
    <select id="student-course" name="student_course">
        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="BBA">BBA</option>
        <option value="BSC">BSC</option>
    </select><br><br>

    <label for="student-year">Year:</label>
    <select id="student-year" name="student_year">
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
    </select><br><br>

    <label for="student-semester">Semester:</label>
    <select id="student-semester" name="student_semester">
        <option value="">Select Semester</option>
        <option value="1">1st Semester</option>
        <option value="2">2nd Semester</option>
        <option value="3">3rd Semester</option>
        <option value="4">4th Semester</option>
        <option value="5">5th Semester</option>
        <option value="6">6th Semester</option>
    </select><br><br>

    <label>Interests:</label>
    <input type="checkbox" id="interest-sports" name="student_interests" value="sports"> <label for="interest-sports">Sports</label>
    <input type="checkbox" id="interest-music" name="student_interests" value="music"> <label for="interest-music">Music</label>
    <input type="checkbox" id="interest-art" name="student_interests" value="art"> <label for="interest-art">Art</label><br><br>

    <label for="student-color">Favorite Color:</label>
    <input type="color" id="student-color" name="student_color"><br><br>

    <label for="student-file">Upload ResumeFile:</label>
    <input type="file" id="student-file" name="student_file" accept=".pdf"><br><br>

    <label for="student-image">Upload Image:</label>
    <input type="file" id="student-image" name="student_image" accept="image/*"><br><br>

    <label for="student-rating">Rate our services:</label>
    <input type="range" id="student-rating" name="student_rating" min="1" max="5"><br><br>

    <label for="student-comments">Comments:</label>
    <textarea id="student-comments" name="student_comments" placeholder="Enter Your Comments"></textarea><br><br>

    <input type="checkbox" id="student-agree" name="student_agree">
    <label for="student-agree">I agree to the terms and conditions</label><br><br>   

    <input type="submit" value="Submit">  
    <input type="reset" value="Reset">
</form>

<hr>
<footer>
    <p>&copy; 2026 Student Information Form. All rights reserved.</p>   
</footer>

</body>
</html>
