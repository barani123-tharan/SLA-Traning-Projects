<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Layouts</title>
  <style>
   /* 1 */
    * {
      margin: 0;
      padding: 0;
      box-shadow: none;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f0f2f5;
      padding: 40px 20px;
    }

    .section-title {
      text-align: center;
      margin: 40px 0 20px 0;
      color: #1a1a1a;
      font-size: 1.8rem;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

  /* 2 */
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.833);
      height: 200px; 
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item img:hover {
      transform: scale(1.05);
    }

   /* 3 */
    .blog-wrapper {
      display: grid;
      place-items: center; 
      max-width: 1200px;
      margin: 0 auto;
    }

    .blog-card {
      display: flex;
      flex-direction: row; 
      max-width: 800px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .blog-image, .blog-content {
      flex: 1; 
    }

    .blog-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .blog-content {
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .category {
      color: #00bcd4;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .blog-content h2 {
      margin-bottom: 12px;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .blog-content p {
      color: #666;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .read-more {
      align-self: flex-start; 
      color: #ff5722;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
    }

   
    @media (max-width: 768px) {
      .blog-card {
        flex-direction: column; 
      }
      .blog-image {
        height: 250px; 
      }
    }
/* 4 */
    .flex-container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      height: 250px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);

      flex-direction: row;           
      justify-content: space-between; 
      align-items: center;       
      gap: 15px;                     

    .box {
      width: 100px;
      height: 100px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 6px;
      font-size: 1.1rem;
    }

    .box-1 { background-color: #ff5722; }
    .box-2 { background-color: #00bcd4; }
    .box-3 { background-color: #9c27b0; }
  </style>
</head>
<body>

  <!-- 1: Photo Gallery -->
  <h2 class="section-title">1. Responsive CSS Grid Photo Gallery</h2>
  <div class="gallery-container">
    <div class="gallery-item"><img src="phone.jpg" alt="Gallery Image 1"></div>
    <div class="gallery-item"><img src="D:\SLA\HTML 13.05.2026\Sample Images\womenswear1.jpg" alt="Gallery Image 2"></div>
    <div class="gallery-item"><img src="HTML 13.05.2026/Sample Images/womenswear2.jpg" alt="Gallery Image 3"></div>
    <div class="gallery-item"><img src="HTML 13.05.2026/Sample Images/womenswear3.jpg" alt="Gallery Image 4"></div>
  </div>

  <!-- 2: Blog Card -->
  <h2 class="section-title">2.Blog Post</h2>
  <main class="blog-wrapper">
    <article class="blog-card">
      <div class="blog-image">
        <img src="HTML 13.05.2026/Sample Images/phone.jpg" alt="Blog Feature">
      </div>
      <div class="blog-content">
        <span class="category">Technology</span>
        <h2>Mastering CSS Flexbox & Grid</h2>
        <p>Modern layouts are easier than ever. Combining both systems lets you build complex, fully responsive web designs with minimal code.</p>
        <a href="#" class="read-more">Read More &rarr;</a>
      </div>
    </article>
  </main>

  <!-- Layout 3: Flexbox Box Layout Controls -->
  <h2 class="section-title">3. Flexbox Spacing & Alignment</h2>
  <div class="flex-container">
    <div class="box box-1">Box 1</div>
    <div class="box box-2">Box 2</div>
    <div class="box box-3">Box 3</div>
  </div>

</body>
</html>
