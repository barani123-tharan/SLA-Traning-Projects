<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 1 Assignment</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="p-4">

  <!-- 1. Heading with display-1, uppercase, primary bg, and white text -->
  <h1 class="display-1 text-uppercase bg-primary text-white p-3">Bootstrap Assignment</h1>

  <hr class="my-5">

  <!-- 2. Grid with 12 equal columns -->
  <div class="container">
    <div class="row text-center">
      <div class="col-1 border bg-light">1</div>
      <div class="col-1 border bg-light">2</div>
      <div class="col-1 border bg-light">3</div>
      <div class="col-1 border bg-light">4</div>
      <div class="col-1 border bg-light">5</div>
      <div class="col-1 border bg-light">6</div>
      <div class="col-1 border bg-light">7</div>
      <div class="col-1 border bg-light">8</div>
      <div class="col-1 border bg-light">9</div>
      <div class="col-1 border bg-light">10</div>
      <div class="col-1 border bg-light">11</div>
      <div class="col-1 border bg-light">12</div>
    </div>
  </div>

  <hr class="my-5">

  <!-- 3. Two-column layout using col-6 -->
  <div class="container">
    <div class="row align-items-center">
      <div class="col-6">
        <img src="D:\SLA\Sample Images\phone.jpg" alt="sample image" class="img-fluid w-50 h-50">
      </div>
      <div class="col-6">
        <h3>Content Column</h3>
        <p>This is the second column containing text content next to the image.</p>
      </div>
    </div>
  </div>

  <hr class="my-5">

  <!-- 4. Flexbox container with justify-content-evenly and order classes -->
  <div class="d-flex justify-content-evenly bg-light p-3">
    <div class="p-4 bg-danger text-white order-5">Box 1 (Order 5)</div>
    <div class="p-4 bg-warning text-white order-1">Box 2 (Order 1)</div>
    <div class="p-4 bg-success text-white order-4">Box 3 (Order 4)</div>
    <div class="p-4 bg-info text-white order-2">Box 4 (Order 2)</div>
    <div class="p-4 bg-dark text-white order-3">Box 5 (Order 3)</div>
  </div>

  <hr class="my-5">

  <!-- 5. Paragraph with m-5, p-5, rounded-pill, centered text, and background -->
  <p class="m-5 p-5 rounded-pill text-center bg-info text-white border border-primary">
    This is a paragraph with specific margins, padding, and a pill-shaped border.
  </p>

</body>
</html>
