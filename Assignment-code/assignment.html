<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment HTML CSS</title>
    <link rel="icon" href="Sample Images/htmltitle.jpg">
    <link rel="stylesheet" href="assignment.css">
    <style>
       .internal-css {
            color: green;
            font-size: 18px;
            font-family: Arial, sans-serif;
            border: 16px solid black;
            padding: 10px;
            background-color: lightyellow;
        } 
    </style>
</head>
<body>
    <!-- 1. Inline CSS -->
    <h1 style="color: blue; font-size: 24px; border: 20px solid red; padding: 10px; background-color: lightgray; text-align: center;"
>
        this  Webpage Contaning Inline, Internal and External CSS
    </h1> <br> <br>
    <!-- 2. Internal CSS -->
    <p class="internal-css">
        This paragraph is styled using internal CSS. It has a green color and a font size of 18px.
    </p> <br> <br>
    <!-- 3. External CSS -->
     <p class="external-css">
        This paragraph is styled using external CSS. It has a red color and a font size of 20px.
     </p>
     <div class="product-card">
    <img src="menswear2.jpg" alt="Product Image">
    <div class="card-content">
        <h3 class="product-title">Wireless Headphones</h3>
        <p class="product-price">$99.99</p>
        <button class="buy-btn">Add to Cart</button>
    </div>
</div>


</body>
</html>
